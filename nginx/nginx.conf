upstream django_server {
    server costnav:8000;
    # Keepalive connections for better performance
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Map to detect malicious user agents
map $http_user_agent $bad_bot {
    default 0;
    ~*(masscan|nmap|nikto|sqlmap|dirbuster|gobuster|zgrab|shodan|censys) 1;
    ~*(acunetix|nessus|openvas|nexpose|qualys|burp|metasploit) 1;
    ~*(scrapy|wget|curl|python-requests|go-http-client) 1;
    ~*(scanner|probe|crawler|spider|bot|exploit) 1;
    "" 1; # Empty user agent
}

# Map to detect suspicious query strings (SQL injection, XSS, etc.)
map $query_string $bad_query {
    default 0;
    ~*(union.*select|insert.*into|delete.*from|drop.*table) 1;
    ~*(concat.*\(|hex\(|unhex\(|sleep\(|benchmark\() 1;
    ~*(<script|javascript:|onerror=|onload=) 1;
    ~*(\.\.\/|\.\.\\|etc\/passwd|boot\.ini) 1;
    ~*(eval\(|base64_decode|exec\(|system\() 1;
}

# Redirect HTTP to HTTPS for API only
server {
    listen 80;
    server_name api.costnav.com;

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        alias /var/lib/letsencrypt/;
        allow all;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API subdomain
server {
    listen 443 ssl;
    http2 on;
    server_name api.costnav.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.costnav.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.costnav.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.costnav.com/chain.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    server_tokens off;

    # Block malicious bots
    if ($bad_bot) {
        return 403;
    }

    # Block suspicious query strings
    if ($bad_query) {
        return 403;
    }

    # Block requests for common exploit files and paths
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 403;
    }

    location ~* /(wp-admin|wp-login|wp-content|wordpress|phpmyadmin|pma|mysql|admin|administrator|login\.php|xmlrpc\.php) {
        return 403;
    }

    location ~* /(\.|\.env|\.git|\.svn|\.htaccess|web\.config|\.well-known/security\.txt) {
        # Allow Let's Encrypt but block other dotfiles
        if ($request_uri !~* "^/\.well-known/acme-challenge/") {
            return 403;
        }
    }

    # Block common scanning paths
    location ~* /(vendor|composer\.json|package\.json|yarn\.lock|\.aws|\.azure) {
        return 403;
    }

    # IP Whitelist - Replace with your actual allowed IPs
    # Example: allow 203.0.113.0/24; (CIDR notation for range)
    # Example: allow 198.51.100.50; (single IP)
    # allow 41.66.0.0/16;
    # allow 154.160.0.0/16;
    # allow 178.128.37.206;  # Your existing frontend IP
    # allow 10.0.0.0/8;      # Private network (if API accessed from same VPC)
    # deny all;              # Deny everyone else

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /media/ {
        alias /app/media_volume/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django application - all routes
    location ~ ^/(api|auth|accounts)/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://django_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://django_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}