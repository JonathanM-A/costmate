# ============================================
# GLOBAL SETTINGS
# ============================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log warn;

# ============================================
# UPSTREAM SERVER
# ============================================

upstream django_server {
    server costmetrix:8000;
    keepalive 32;
}

# ============================================
# SERVER CONFIGURATION
# ============================================

server {
    listen 80;
    server_name api.costnav.com;

    # ------------------------------------------------
    # Security headers
    # ------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ------------------------------------------------
    # CORS for frontend
    # ------------------------------------------------
    add_header Access-Control-Allow-Origin "http://178.128.37.206" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-CSRFToken" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "http://178.128.37.206";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-CSRFToken";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # ------------------------------------------------
    # Static files
    # ------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------
    # API routes (optional rate limiting)
    # ------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://django_server;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------
    # Auth routes (optional separate limit)
    # ------------------------------------------------
    location /auth/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://django_server;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------
    # Default route
    # ------------------------------------------------
    location / {
        proxy_pass http://django_server;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------
    # Rate limit response
    # ------------------------------------------------
    error_page 503 /rate_limit.json;
    location = /rate_limit.json {
        default_type application/json;
        return 429 '{"error": "Too many requests. Please try again later."}';
    }
}