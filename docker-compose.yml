services:
  costmetrix:
    image: costmetrix
    build:
      context: .
      dockerfile: ./Dockerfile
    command: >
      sh -c "python manage.py initialize_system &&
            python manage.py collectstatic --noinput &&
            watchfiles --filter python 'gunicorn config.wsgi:application --bind 0.0.0.0:8000' ./"
    volumes:
      - .:/app  # Sync local code for development
      - ./staticfiles:/app/staticfiles
    ports:
      - 8000:8000
    env_file:
      - .env  # Load all variables (DB_NAME, DB_USER, etc.) from here
    environment:
      - DB_HOST=db  # Changed from host.docker.internal to db
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - redis
      - db
  
  db:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    command: sh -c "mkdir" -p /app/beat && celery -A config beat -l info --schedule=tmp/celerybeat-schedule
    volumes:
      - .:/app
      - /celerybeat_schedule:/app/beat
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media_volume
    depends_on:
      - costmetrix
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  celerybeat_schedule:
